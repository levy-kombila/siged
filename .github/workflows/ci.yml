name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: siged_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra ghostscript libreoffice-writer-nogui
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests SQLite
        working-directory: backend
        run: python -m pytest -q
      - name: Tests PostgreSQL
        working-directory: backend
        env: { SIGED_TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/siged_test" }
        run: python -m pytest -q
