# Déploiement mono-serveur (PC de test ou VM Oracle Cloud) :
#   Caddy (HTTPS automatique, TLS 1.3) -> API FastAPI (4 workers) + worker (OCR, intégrité, DUA)
#   PostgreSQL (métadonnées / index / audit) + MinIO (fichiers chiffrés AES-256)
# Démarrage : docker compose up -d --build      (le fichier .env doit exister, voir docs/guide_secrets.md)
name: siged

x-app: &app
  build: ./backend
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    minio: { condition: service_started }
  volumes:
    - inbox:/data/inbox
  environment:
    SIGED_INBOX_PATH: /data/inbox
  restart: unless-stopped

services:
  api:
    <<: *app

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    # Accessible depuis VOTRE PC uniquement (pgAdmin, uvicorn en local) sur le port 5433,
    # pour ne pas entrer en conflit avec un PostgreSQL déjà installé sur Windows (port 5432).
    ports: ["127.0.0.1:5433:5432"]
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO n'est plus publié sur Docker Hub depuis 2026 (minio/minio : « pull access denied »).
    # pgsty/minio est la reprise communautaire, compatible à l'identique (mêmes variables MINIO_*,
    # même format de données) et multi-architecture (amd64 pour votre PC, arm64 pour Oracle).
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    command: server /data --console-address ":9001"
    env_file: .env
    volumes: [miniodata:/data]
    # Pas de healthcheck : l'API réessaie la connexion au stockage tant qu'il n'est pas prêt.
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SIGED_DOMAIN: ${SIGED_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificats (à conserver)
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./deploy/scripts:/scripts:ro
      - backups:/backups
      - miniodata:/minio-data:ro
    depends_on: [postgres]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  miniodata:
  inbox:
  backups:
