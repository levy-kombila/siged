# Déploiement mono-serveur (PC de test ou VM Oracle Cloud) :
#   Caddy (HTTPS automatique, TLS 1.3) -> API FastAPI (4 workers) + worker (OCR, intégrité, DUA)
#   PostgreSQL (métadonnées / index / audit) + MinIO (fichiers chiffrés AES-256)
# Démarrage : docker compose up -d --build      (le fichier .env doit exister, voir docs/guide_secrets.md)
name: siged

x-app: &app
  build: ./backend
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    minio: { condition: service_healthy }
  volumes:
    - inbox:/data/inbox
  environment:
    SIGED_INBOX_PATH: /data/inbox
  restart: unless-stopped

services:
  api:
    <<: *app

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    env_file: .env
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SIGED_DOMAIN: ${SIGED_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificats (à conserver)
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./deploy/scripts:/scripts:ro
      - backups:/backups
      - miniodata:/minio-data:ro
    depends_on: [postgres]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  miniodata:
  inbox:
  backups:
