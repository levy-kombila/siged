# Déploiement mono-serveur : Nginx (TLS 1.3) -> API FastAPI (x4 workers) + worker
#                            PostgreSQL (métadonnées/index/audit) + MinIO (fichiers chiffrés)
name: siged

x-app: &app
  build: ./backend
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    minio: { condition: service_healthy }
  volumes:
    - inbox:/data/inbox
  environment:
    SIGED_INBOX_PATH: /data/inbox
  restart: unless-stopped

services:
  api:
    <<: *app

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    env_file: .env
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["443:443", "80:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on: [api]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./deploy/scripts:/scripts:ro
      - backups:/backups
      - miniodata:/minio-data:ro
    depends_on: [postgres]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  inbox:
  backups:
