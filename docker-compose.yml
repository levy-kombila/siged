# Déploiement mono-serveur (PC de test ou VM Oracle Cloud) :
#   Caddy (HTTPS automatique, TLS 1.3) -> API FastAPI (4 workers) + worker (OCR, intégrité, DUA)
#   PostgreSQL (métadonnées / index / audit) + volume « storage » (fichiers chiffrés AES-256-GCM)
# Démarrage : docker compose up -d --build      (le fichier .env doit exister, voir docs/guide_secrets.md)
#
# Stockage des fichiers : système de fichiers chiffré par l'application, sur un volume Docker
# séparé de la base (exigence « métadonnées en base SQL / fichiers en Object Storage ou système
# de fichiers »). MinIO n'est plus utilisé : ses images Docker ont été retirées en septembre 2026.
# Pour un stockage objet externe compatible S3 (Garage, Cloudflare R2...), voir docs/guide_secrets.md.
name: siged

x-app: &app
  build: ./backend
  env_file: .env
  environment:
    SIGED_STORAGE_BACKEND: local
    SIGED_STORAGE_LOCAL_PATH: /data/storage
    SIGED_INBOX_PATH: /data/inbox
  depends_on:
    postgres: { condition: service_healthy }
  volumes:
    - storage:/data/storage
    - inbox:/data/inbox
  restart: unless-stopped

services:
  api:
    <<: *app

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SIGED_DOMAIN: ${SIGED_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificats (à conserver)
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./deploy/scripts:/scripts:ro
      - backups:/backups
      - storage:/storage-data:ro
    depends_on: [postgres]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  storage:
  inbox:
  backups:
