# Reverse proxy : TLS 1.3 uniquement, HSTS, limites de taille et de débit.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/siged.crt;
    ssl_certificate_key /etc/nginx/certs/siged.key;
    ssl_protocols TLSv1.3;                       # chiffrement en transit : TLS 1.3 exclusivement
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_request_buffering off;                  # flux de téléversement transmis directement (hash à la volée)

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;    # anti force brute
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
